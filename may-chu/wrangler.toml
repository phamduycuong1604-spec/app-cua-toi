# Cấu hình "máy chủ nhắc giờ" chạy trên Cloudflare Workers (miễn phí)
name = "viec-hom-nay-nhac"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true

# Mỗi phút máy chủ thức dậy một lần để xem có việc nào cần nhắc không
[triggers]
crons = ["* * * * *"]

# Cơ sở dữ liệu D1 (lần đầu triển khai Cloudflare sẽ tự tạo)
[[d1_databases]]
binding = "DB"

# AI của Cloudflare (Whisper nghe tiếng Trung, mô hình dịch) cho trang dịch video – miễn phí 10.000 neuron/ngày
[ai]
binding = "AI"
