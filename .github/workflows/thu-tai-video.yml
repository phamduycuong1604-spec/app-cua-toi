name: Thử Fish Audio (tạm)
on:
  push:
    branches: [thu-tai-video]
jobs:
  thu:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "=== danh sách giọng tiếng Việt"
          curl -s "https://api.fish.audio/model?page_size=8&language=vi&sort_by=score" | python3 -c "
          import json,sys
          d=json.load(sys.stdin); print('keys', list(d.keys()), 'total', d.get('total'))
          for m in d.get('items',[])[:8]: print(m.get('_id'), '|', m.get('title'), '|', m.get('languages'), '| like', m.get('like_count'), '| task', m.get('task_count'), '| state', m.get('state'), '| visibility', m.get('visibility'))
          " || echo "LOI danh sach"
          echo "=== tts không có mã"
          curl -s -w "\nHTTP %{http_code}\n" -X POST https://api.fish.audio/v1/tts -H "model: s2.1-pro-free" -H "Content-Type: application/json" -d '{"text":"xin chao","format":"mp3"}' | head -c 400
          echo; echo "=== CORS preflight"
          curl -s -o /dev/null -D - -X OPTIONS https://api.fish.audio/v1/tts -H "Origin: https://phamduycuong1604-spec.github.io" -H "Access-Control-Request-Method: POST" -H "Access-Control-Request-Headers: authorization,content-type,model" | grep -i "access-control\|HTTP/"
